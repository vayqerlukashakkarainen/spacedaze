<!doctype html>
<html>
	<head>
		<script
			data-goatcounter="https://iorisadog.goatcounter.com/count"
			async
			src="//gc.zgo.at/count.js"
		></script>
		<style>
			:root {
				color-scheme: dark;
			}
			body {
				margin: 0;
				background: #000;
			}
			#loading-screen {
				position: fixed;
				inset: 0;
				z-index: 10000;
				display: flex;
				align-items: center;
				justify-content: center;
				background: #000;
				color: #fff;
				font-family: "Courier New", monospace;
				text-transform: uppercase;
				transition: opacity 180ms linear;
			}
			#loading-screen.is-hidden {
				opacity: 0;
				pointer-events: none;
			}
			.loading-content {
				width: min(420px, calc(100vw - 64px));
				text-align: center;
			}
			.loading-credit {
				margin-bottom: 32px;
				color: #6f7f89;
				font-size: 12px;
				letter-spacing: 3px;
			}
			.loading-title {
				margin-bottom: 12px;
				font-size: 18px;
				font-weight: bold;
				letter-spacing: 3px;
			}
			.loading-current {
				height: 16px;
				margin-bottom: 10px;
				overflow: hidden;
				color: #43d9ff;
				font-size: 10px;
				letter-spacing: 1px;
				text-overflow: ellipsis;
				white-space: nowrap;
			}
			.loading-track {
				height: 8px;
				padding: 2px;
				border: 1px solid #fff;
				background: #071018;
			}
			.loading-bar {
				height: 100%;
				width: 0;
				background: #43d9ff;
				box-shadow: 0 0 10px rgb(67 217 255 / 55%);
				transition: width 90ms linear;
			}
			.loading-percent {
				margin-top: 8px;
				color: #6f7f89;
				font-size: 10px;
				letter-spacing: 2px;
			}
			.song {
				display: flex;
				gap: 12px;
				opacity: 0;
				transition: opacity 600ms ease;
			}
			.song.show {
				opacity: 1;
			}
			.song img {
				width: 64px;
				height: 64px;
			}
			.song p {
				color: rgb(148, 148, 148);
				margin: 0;
				padding: 0;
				font-size: 14px;
				padding-top: 2px;
			}
			.song h2 {
				color: white;
				margin: 0;
				padding: 0;
				font-size: 18px;
			}
			.song-container {
				display: flex;
				gap: 12px;
				align-items: center;
			}

			.controls {
				position: absolute;
				top: 100px;
				left: calc(32px + 1dvw);
				display: flex;
				flex-direction: column;
				gap: 4px;
			}
			.list {
				width: 240px;
				max-width: 300px;
				display: flex;
				align-items: center;
				justify-content: space-between;
			}
			@media (max-width: 1360px) {
				.list {
					flex-direction: column;
					width: auto;
					align-items: start;
				}
			}
		</style>
		<title>spacedaze</title>
		<script type="module" crossorigin src="./assets/index-DpXCDPgZ.js"></script>
		<link rel="modulepreload" crossorigin href="./assets/kaplay-BwMh2aq_.js">
	</head>
	<body style="overflow: hidden">
		<div id="loading-screen" role="status" aria-live="polite">
			<div class="loading-content">
				<div class="loading-credit">Created by Luhakk</div>
				<div class="loading-title">Loading assets...</div>
				<div id="loading-current" class="loading-current">Starting systems</div>
				<div
					class="loading-track"
					role="progressbar"
					aria-label="Loading game assets"
					aria-valuemin="0"
					aria-valuemax="100"
					aria-valuenow="0"
				>
					<div id="loading-bar" class="loading-bar"></div>
				</div>
				<div id="loading-percent" class="loading-percent">0%</div>
			</div>
		</div>
	</body>
</html>

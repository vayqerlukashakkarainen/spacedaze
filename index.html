<!doctype html>
<html>
	<head>
		<script
			data-goatcounter="https://iorisadog.goatcounter.com/count"
			async
			src="//gc.zgo.at/count.js"
		></script>
		<style>
			.song {
				display: flex;
				gap: 12px;
				opacity: 0;
				transition: opacity 600ms ease;
			}
			.song.show {
				opacity: 1;
			}
			.song img {
				width: 64px;
				height: 64px;
			}
			.song p {
				color: rgb(148, 148, 148);
				margin: 0;
				padding: 0;
				font-size: 14px;
				padding-top: 2px;
			}
			.song h2 {
				color: white;
				margin: 0;
				padding: 0;
				font-size: 18px;
			}
			.song-container {
				display: flex;
				gap: 12px;
				align-items: center;
			}

			.controls {
				position: absolute;
				top: 100px;
				left: calc(32px + 1dvw);
				display: flex;
				flex-direction: column;
				gap: 4px;
			}
			.list {
				width: 240px;
				max-width: 300px;
				display: flex;
				align-items: center;
				justify-content: space-between;
			}
			@media (max-width: 1360px) {
				.list {
					flex-direction: column;
					width: auto;
					align-items: start;
				}
			}
		</style>
		<title>spacedaze</title>
	</head>
	<body style="overflow: hidden">
		<script src="src/main.ts" type="module"></script>
	</body>
</html>

<!doctype html>
<html>
	<head>
		<link rel="icon" type="image/png" sizes="24x24" href="./favicon.png" />
		<script
			data-goatcounter="https://iorisadog.goatcounter.com/count"
			async
			src="//gc.zgo.at/count.js"
		></script>
		<style>
			:root {
				color-scheme: dark;
				overflow: hidden;
				overscroll-behavior: none;
			}
			body {
				margin: 0;
				background: #000;
				overflow: hidden;
				overscroll-behavior: none;
				touch-action: none;
				user-select: none;
				-webkit-user-select: none;
			}
			canvas {
				display: block;
				touch-action: none;
				user-select: none;
				-webkit-user-drag: none;
				-webkit-user-select: none;
			}
			#loading-screen {
				position: fixed;
				inset: 0;
				z-index: 10000;
				display: flex;
				align-items: center;
				justify-content: center;
				background: #000;
				color: #fff;
				font-family: "Courier New", monospace;
				text-transform: uppercase;
				transition: opacity 180ms linear;
			}
			#loading-screen.is-hidden {
				opacity: 0;
				pointer-events: none;
			}
			.loading-content {
				position: relative;
				width: min(420px, calc(100vw - 64px));
				height: 170px;
				text-align: center;
			}
			.loading-brand {
				position: absolute;
				top: 50%;
				left: 50%;
				width: min(384px, calc(100vw - 64px));
				height: auto;
				image-rendering: pixelated;
				transform: translate(-50%, -50%);
				transition: transform 560ms cubic-bezier(0.2, 0.8, 0.2, 1);
			}
			#loading-screen.is-progress-visible .loading-brand {
				transform: translate(-50%, calc(-50% - 44px));
			}
			.loading-progress {
				position: absolute;
				top: calc(50% + 14px);
				left: 0;
				width: 100%;
				opacity: 0;
				transform: translateY(12px);
				transition:
					opacity 260ms ease 170ms,
					transform 420ms cubic-bezier(0.2, 0.8, 0.2, 1) 120ms;
			}
			#loading-screen.is-progress-visible .loading-progress {
				opacity: 1;
				transform: translateY(0);
			}
			.loading-current {
				height: 16px;
				margin-bottom: 10px;
				overflow: hidden;
				color: #43d9ff;
				font-size: 10px;
				letter-spacing: 1px;
				text-overflow: ellipsis;
				white-space: nowrap;
			}
			.loading-track {
				height: 8px;
				padding: 2px;
				border: 1px solid #fff;
				background: #071018;
			}
			.loading-bar {
				height: 100%;
				width: 0;
				background: #43d9ff;
				box-shadow: 0 0 10px rgb(67 217 255 / 55%);
				transition: width 90ms linear;
			}
			.loading-percent {
				margin-top: 8px;
				color: #6f7f89;
				font-size: 10px;
				letter-spacing: 2px;
			}
			@media (prefers-reduced-motion: reduce) {
				.loading-brand,
				.loading-progress,
				#loading-screen {
					transition-duration: 1ms;
					transition-delay: 0ms;
				}
			}
			.song {
				display: flex;
				gap: 12px;
				opacity: 0;
				transition: opacity 600ms ease;
			}
			.song.show {
				opacity: 1;
			}
			.song img {
				width: 64px;
				height: 64px;
			}
			.song p {
				color: rgb(148, 148, 148);
				margin: 0;
				padding: 0;
				font-size: 14px;
				padding-top: 2px;
			}
			.song h2 {
				color: white;
				margin: 0;
				padding: 0;
				font-size: 18px;
			}
			.song-container {
				display: flex;
				gap: 12px;
				align-items: center;
			}

			.controls {
				position: absolute;
				top: 100px;
				left: calc(32px + 1dvw);
				display: flex;
				flex-direction: column;
				gap: 4px;
			}
			.list {
				width: 240px;
				max-width: 300px;
				display: flex;
				align-items: center;
				justify-content: space-between;
			}
			@media (max-width: 1360px) {
				.list {
					flex-direction: column;
					width: auto;
					align-items: start;
				}
			}
		</style>
		<title>spacedaze</title>
		<script type="module" crossorigin src="./assets/index-JgdX-Nty.js"></script>
		<link rel="modulepreload" crossorigin href="./assets/kaplay-BwMh2aq_.js">
	</head>
	<body>
		<div id="loading-screen" role="status" aria-live="polite">
			<div class="loading-content">
				<canvas
					id="loading-brand"
					class="loading-brand"
					width="384"
					height="32"
					role="img"
					aria-label="LUHAKK GAMES"
				></canvas>
				<div id="loading-progress" class="loading-progress" aria-hidden="true">
					<div id="loading-current" class="loading-current">Starting systems</div>
					<div
						class="loading-track"
						role="progressbar"
						aria-label="Loading game assets"
						aria-valuemin="0"
						aria-valuemax="100"
						aria-valuenow="0"
					>
						<div id="loading-bar" class="loading-bar"></div>
					</div>
					<div id="loading-percent" class="loading-percent">0%</div>
				</div>
			</div>
		</div>
	</body>
</html>
